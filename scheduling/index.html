<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Your Market Is Open · Book Your Deck Jobs Strategy Session</title>
<meta name="description" content="Your market is open. Book your Deck Jobs Strategy Session below.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#000000',
          surface: '#0D0D0D',
          elevated: '#141414',
          border: '#222222',
          ink: '#F5F2EB',
          'ink-muted': '#9CA3AF',
          'ink-subtle': '#6B7280',
          gold: '#c7963f',
          'gold-deep': '#ab8032',
          live: '#10b981',
          'live-bright': '#34d399',
        },
        fontFamily: {
          display: ['Inter', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .display { font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.035em; font-weight: 800; }
  iframe.ghl-embed { width: 100% !important; height: 100% !important; display: block !important; border: 0 !important; background: #fff; }
  @media (max-height: 700px) {
    html, body { height: auto; }
    body { overflow: auto; }
    .calendar-shell { min-height: 720px; }
  }
</style>

<!--
  ====================================================================
  NO META PIXEL ON THIS PAGE — INTENTIONAL.
  This terminal page is reached only by sub-ICP traffic
  (revenue <$500K AND no crews AND $0–$500/mo ad spend, all three).
  We still take the call, but Meta's algorithm should NOT train on
  these conversions or we'll contaminate the optimization signal.
  Do not add a pixel here.
  ====================================================================
-->

</head>
<body class="bg-bg text-ink antialiased flex flex-col">

<!-- Top bar (thin) -->
<header class="flex-shrink-0 border-b border-border/50">
  <div class="max-w-3xl mx-auto px-5 py-2.5">
    <span class="font-black text-[12px] tracking-[0.18em] uppercase text-ink">Decking<span class="text-gold">Leads</span><sup class="text-[8px] text-ink-muted align-top ml-0.5">.com</sup></span>
  </div>
</header>

<!-- Hero (compact, centered) -->
<div class="flex-shrink-0 px-5 py-4 sm:py-5 text-center">

  <!-- Eyebrow: green pulsing dot + MARKET OPEN -->
  <div class="inline-flex items-center gap-2 mb-2 px-2.5 py-1 rounded-full border border-live/40" style="background: rgba(16, 185, 129, 0.10);">
    <span class="relative flex w-2 h-2">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-live opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2 w-2 bg-live"></span>
    </span>
    <span class="text-[11px] font-bold tracking-[0.18em] uppercase text-live-bright">Market Open</span>
  </div>

  <h1 id="hero-h1" class="display text-[26px] sm:text-[36px] leading-[1.05] mb-2 max-w-2xl mx-auto">
    Your market is open.
  </h1>
  <p class="text-sm sm:text-base text-ink-muted leading-snug max-w-xl mx-auto">
    45-minute Google Meet. Bring your numbers, your ad accounts, and your skepticism.
  </p>

</div>

<!-- Social proof banner (1 line) -->
<div class="flex-shrink-0 border-y border-border/50 bg-surface">
  <div class="max-w-3xl mx-auto px-5 py-2 text-center">
    <p class="text-[10px] sm:text-[11px] tracking-[0.18em] text-ink-muted uppercase font-semibold">
      Trusted by deck builders in San Antonio · Bend · Denver · Atlanta · Pittsburgh
    </p>
  </div>
</div>

<!-- Calendar fills remaining viewport -->
<div class="flex-1 min-h-0 calendar-shell">
  <iframe
    id="ghl-booking"
    src="https://api.seasonproofgrowth.com/widget/booking/6Ck4IfG5SatgIkAZJ7yo"
    title="Book your Deck Jobs Strategy Session"
    class="ghl-embed">
  </iframe>
</div>

<!-- GHL embed runtime -->
<script src="https://api.seasonproofgrowth.com/js/form_embed.js" type="text/javascript"></script>

<!-- Personalize hero + prefill the GHL iframe from the LP's sessionStorage -->
<script>
(function () {
  let data = {};
  try { data = JSON.parse(sessionStorage.getItem('dl_qualify_data') || '{}'); }
  catch (_) { data = {}; }

  if (data.name) {
    const first = data.name.trim().split(/\s+/)[0];
    const heroH1 = document.getElementById('hero-h1');
    if (heroH1 && first) {
      heroH1.textContent = `${first}, your market is open.`;
    }
  }

  const iframe = document.getElementById('ghl-booking');
  if (iframe && data.email) {
    const url = new URL(iframe.src);
    if (data.name) {
      const parts = data.name.trim().split(/\s+/);
      url.searchParams.set('first_name', parts[0] || '');
      if (parts.length > 1) url.searchParams.set('last_name', parts.slice(1).join(' '));
    }
    if (data.email) url.searchParams.set('email', data.email);
    if (data.phone) url.searchParams.set('phone', data.phone);
    iframe.src = url.toString();
  }
})();
</script>

</body>
</html>
