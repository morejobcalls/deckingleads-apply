<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="robots" content="noindex, nofollow">
<title>Loading your confirmation…</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0D0D0D; color: #F8F7F3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1.25rem; text-align: center; padding: 1rem; }
  .spin { width: 32px; height: 32px; border: 3px solid rgba(248,247,243,.15); border-top-color: #C7963F; border-radius: 50%; animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 0.95rem; color: rgba(248,247,243,.7); }
</style>
</head>
<body>
<div class="wrap">
  <div class="spin"></div>
  <p>Loading your confirmation…</p>
</div>
<script>
(function () {
  // Pull the destination path from ?next= (default: /confirmation/).
  // GHL calendar redirects here after booking; this page breaks out of the
  // calendar iframe and navigates the parent window to the real confirmation page.
  var params = new URLSearchParams(window.location.search);
  var next = params.get('next') || '/confirmation/';

  // Whitelist allowed destinations so this can't be abused as an open redirect.
  var allowed = ['/confirmation/', '/scheduled/', '/yt/scheduled/'];
  if (allowed.indexOf(next) === -1) {
    next = '/confirmation/';
  }

  // Preserve query string from the calendar redirect (GHL adds appointment params).
  var qs = window.location.search
    .replace(/^\?/, '')
    .split('&')
    .filter(function (kv) { return kv && kv.indexOf('next=') !== 0; })
    .join('&');
  var dest = next + (qs ? '?' + qs : '');

  try {
    if (window.top !== window.self) {
      // We're inside an iframe — break out to the parent window.
      window.top.location.href = dest;
    } else {
      // Loaded directly (no iframe) — just go to the destination.
      window.location.replace(dest);
    }
  } catch (e) {
    // Cross-origin top access blocked — fall back to navigating this window.
    window.location.replace(dest);
  }
})();
</script>
</body>
</html>
