<!-- GHL embed runtime -->
<script src="https://api.seasonproofgrowth.com/js/form_embed.js" type="text/javascript"></script>

<!-- Personalize hero + prefill the GHL iframe from the LP's sessionStorage -->
<script>
(function () {
  let data = {};
  try { data = JSON.parse(sessionStorage.getItem('dl_qualify_data') || '{}'); }
  catch (_) { data = {}; }

  if (data.name) {
    const first = data.name.trim().split(/\s+/)[0];
    const heroH1 = document.getElementById('hero-h1');
    if (heroH1 && first) {
      heroH1.innerHTML = `${first}, you took the <span class="text-gold">bet.</span> <br class="hidden sm:block">Pick a time.`;
    }
  }

  const iframe = document.getElementById('ghl-booking');
  if (iframe && data.email) {
    const url = new URL(iframe.src);
    if (data.name) {
      const parts = data.name.trim().split(/\s+/);
      url.searchParams.set('first_name', parts[0] || '');
      if (parts.length > 1) url.searchParams.set('last_name', parts.slice(1).join(' '));
    }
    if (data.email) url.searchParams.set('email', data.email);
    if (data.phone) url.searchParams.set('phone', data.phone);
    if (data.zip) url.searchParams.set('zip', data.zip);
    iframe.src = url.toString();
  }
})();
</script>
